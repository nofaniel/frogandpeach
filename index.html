<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17211f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Frog & Peach</title>
    <meta name="description" content="Frog & Peach — a personal home hub for weather, notes, lists, pages, and more." />
    <meta property="og:title" content="Frog & Peach" />
    <meta property="og:description" content="A personal home hub for weather, notes, lists, pages, and more." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Frog & Peach" />
    <meta name="twitter:description" content="A personal home hub for weather, notes, lists, pages, and more." />
    <meta name="twitter:image" content="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // No-FOUC: repaint the last-applied theme snapshot and color mode before React mounts.
      (function () {
        try {
          var snapshot = JSON.parse(localStorage.getItem('fp-theme-snapshot') || 'null')
          if (snapshot) {
            var root = document.documentElement
            Object.keys(snapshot.cssVars || {}).forEach(function (name) {
              root.style.setProperty(name, snapshot.cssVars[name])
            })
            Object.keys(snapshot.dataAttrs || {}).forEach(function (name) {
              root.setAttribute(name, snapshot.dataAttrs[name])
            })
          }
          var colorMode = localStorage.getItem('fp-color-mode')
          if (colorMode) {
            document.documentElement.setAttribute('data-color-mode', colorMode)
          }
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
