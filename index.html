<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17211f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Frog & Peach</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // No-FOUC: repaint the last-applied theme snapshot before React mounts.
      (function () {
        try {
          var snapshot = JSON.parse(localStorage.getItem('fp-theme-snapshot') || 'null')
          if (!snapshot) return
          var root = document.documentElement
          Object.keys(snapshot.cssVars || {}).forEach(function (name) {
            root.style.setProperty(name, snapshot.cssVars[name])
          })
          Object.keys(snapshot.dataAttrs || {}).forEach(function (name) {
            root.setAttribute(name, snapshot.dataAttrs[name])
          })
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
