<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#4A7C59">
  <title>Flat Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    /* ── Dashboard-specific styles ── */
    .greeting {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .greeting-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .greeting-header {
      padding: 20px 20px 4px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Weather card */
    .weather-card {
      background: linear-gradient(135deg, #4A7C59 0%, #2D5A3D 100%);
      color: #fff;
      border-radius: var(--radius);
      padding: 22px 22px 18px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(74,124,89,0.35);
    }
    .weather-card::before {
      content: '';
      position: absolute;
      top: -30px; right: -30px;
      width: 130px; height: 130px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }
    .weather-location {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.75;
      margin-bottom: 8px;
    }
    .weather-main {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .weather-icon { font-size: 3.2rem; line-height: 1; }
    .weather-temp {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .weather-temp sup { font-size: 1.2rem; vertical-align: top; margin-top: 6px; }
    .weather-desc {
      font-size: 0.9rem;
      opacity: 0.85;
      margin-top: 4px;
    }
    .weather-meta {
      display: flex;
      gap: 14px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.2);
      font-size: 0.83rem;
      opacity: 0.85;
      flex-wrap: wrap;
    }
    .weather-meta span { display: flex; align-items: center; gap: 4px; }

    /* Tides card */
    .tides-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .tide-item {
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .tide-type {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .tide-type.high { color: var(--primary-dark); }
    .tide-type.low  { color: var(--text-muted); }
    .tide-time { font-size: 1.15rem; font-weight: 700; }
    .tide-height { font-size: 0.82rem; color: var(--text-muted); }

    /* Recent sections */
    .recent-note {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .recent-note:last-child { border-bottom: none; }
    .recent-note-title { font-weight: 600; font-size: 0.92rem; }
    .recent-note-preview {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-list {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .recent-list:last-child { border-bottom: none; }
    .recent-list-name { font-weight: 600; font-size: 0.92rem; }
    .recent-list-count { font-size: 0.8rem; color: var(--text-muted); margin-top: 1px; }

    /* Clock */
    #clock {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Skeleton loader */
    .skeleton {
      background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 50%, var(--surface-2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
      height: 14px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .weather-skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.12) 25%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.12) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
      height: 14px;
    }
  </style>
</head>
<body>

  <!-- Greeting -->
  <div class="greeting-header">
    <div class="greeting" id="greeting">Good morning</div>
    <div class="greeting-sub" id="date-display"></div>
  </div>

  <div class="content">

    <!-- Weather Card -->
    <div class="weather-card" id="weather-card">
      <div class="weather-location">Newquay, Cornwall</div>
      <div class="weather-main">
        <div class="weather-icon" id="w-icon">…</div>
        <div>
          <div class="weather-temp" id="w-temp">--<sup>°C</sup></div>
          <div class="weather-desc" id="w-desc">Loading weather...</div>
        </div>
      </div>
      <div class="weather-meta" id="w-meta">
        <span id="w-meta-content" style="opacity:0.6">Fetching conditions...</span>
      </div>
    </div>

    <!-- Tides Card -->
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-label">Tides · predicted</div>
          <h2>Newquay Harbour</h2>
        </div>
        <span style="font-size:1.4rem">🌊</span>
      </div>
      <div class="tides-grid" id="tides-grid">
        <div class="tide-item"><div class="skeleton" style="width:60%;margin-bottom:6px"></div><div class="skeleton" style="width:80%"></div></div>
        <div class="tide-item"><div class="skeleton" style="width:60%;margin-bottom:6px"></div><div class="skeleton" style="width:80%"></div></div>
        <div class="tide-item"><div class="skeleton" style="width:60%;margin-bottom:6px"></div><div class="skeleton" style="width:80%"></div></div>
        <div class="tide-item"><div class="skeleton" style="width:60%;margin-bottom:6px"></div><div class="skeleton" style="width:80%"></div></div>
      </div>
    </div>

    <!-- Recent Notes -->
    <div class="card" id="notes-card" style="display:none">
      <div class="card-header">
        <div>
          <div class="card-label">Recent</div>
          <h2>Notes</h2>
        </div>
        <a href="/notes.html" class="btn btn-ghost btn-sm">See all</a>
      </div>
      <div id="recent-notes"></div>
    </div>

    <!-- Recent Lists -->
    <div class="card" id="lists-card" style="display:none">
      <div class="card-header">
        <div>
          <div class="card-label">Recent</div>
          <h2>Shopping Lists</h2>
        </div>
        <a href="/lists.html" class="btn btn-ghost btn-sm">See all</a>
      </div>
      <div id="recent-lists"></div>
    </div>

  </div><!-- /content -->

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a class="nav-item active" href="/index.html">
      <span class="nav-icon">🏠</span>Home
    </a>
    <a class="nav-item" href="/lists.html">
      <span class="nav-icon">🛒</span>Lists
    </a>
    <a class="nav-item" href="/notes.html">
      <span class="nav-icon">📝</span>Notes
    </a>
    <a class="nav-item" href="/pages.html">
      <span class="nav-icon">🌸</span>Pages
    </a>
    <a class="nav-item" href="/network.html">
      <span class="nav-icon">📡</span>Network
    </a>
  </nav>

  <!-- Clock in header area -->
  <script>
    // Show clock in greeting sub
    function updateClock() {
      const now = new Date();
      const h = now.getHours();
      const time = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      const date = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
      document.getElementById('date-display').textContent = `${date}  ·  ${time}`;
      const greeting = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
      document.getElementById('greeting').textContent = greeting + ' 🌿';
    }
    updateClock();
    setInterval(updateClock, 30000);
  </script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
