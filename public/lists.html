<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4A7C59">
  <title>Lists — Flat Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .list-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      overflow: hidden;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    @media (hover: hover) {
      .list-card:not(.expanded):hover {
        box-shadow: var(--shadow-lg);
        transform: translateY(-1px);
      }
    }
    .list-card-header {
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .list-card-header:active { background: var(--surface-2); }
    .list-card-icon {
      width: 40px; height: 40px;
      background: #E8F5EC;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .list-card-info { flex: 1; min-width: 0; }
    .list-card-name { font-weight: 700; font-size: 1rem; }
    .list-card-count { font-size: 0.8rem; color: var(--text-muted); margin-top: 1px; }
    .list-card-chevron {
      color: var(--text-muted);
      font-size: 1rem;
      transition: transform 0.2s;
    }
    .list-card.expanded .list-card-chevron { transform: rotate(90deg); }

    .list-items {
      display: none;
      padding: 0 18px 16px;
      border-top: 1px solid var(--border);
    }
    .list-card.expanded .list-items { display: block; }

    .list-add-input {
      display: flex;
      gap: 8px;
      padding: 12px 0 4px;
    }
    .list-add-input input {
      flex: 1;
      padding: 10px 14px;
      font-size: 0.92rem;
    }

    .list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .list-item:last-of-type { border-bottom: none; }

    .item-text {
      flex: 1;
      font-size: 0.95rem;
      transition: color 0.2s, text-decoration 0.2s;
    }
    .item-text.done {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .list-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      margin-top: 4px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header class="page-header">
    <span class="header-icon">🛒</span>
    <h1>Shopping Lists</h1>
  </header>

  <div class="content" id="lists-container">
    <div class="empty-state" id="empty-state" style="display:none">
      <div class="empty-icon">🛒</div>
      <h3>No lists yet</h3>
      <p>Tap + to create your first shopping list</p>
    </div>
  </div>

  <!-- FAB -->
  <button class="fab" id="fab" title="New list" aria-label="New list">+</button>

  <!-- New list modal -->
  <div class="modal-backdrop" id="new-list-modal">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">New Shopping List</div>
      <div class="form-group">
        <label for="list-name-input">List name</label>
        <input type="text" id="list-name-input" placeholder="e.g. Tesco weekly shop">
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-secondary w-full" id="cancel-new">Cancel</button>
        <button class="btn btn-primary w-full" id="confirm-new">Create</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a class="nav-item" href="/index.html"><span class="nav-icon">🏠</span>Home</a>
    <a class="nav-item active" href="/lists.html"><span class="nav-icon">🛒</span>Lists</a>
    <a class="nav-item" href="/notes.html"><span class="nav-icon">📝</span>Notes</a>
    <a class="nav-item" href="/pages.html"><span class="nav-icon">🌸</span>Pages</a>
    <a class="nav-item" href="/network.html"><span class="nav-icon">📡</span>Network</a>
  </nav>

  <script src="/js/lists.js"></script>
</body>
</html>
