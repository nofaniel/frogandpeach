<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FDFAF5">
  <title>A page for you</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/botanical.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: #FDFAF5; overflow-x: hidden; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: env(safe-area-inset-bottom, 20px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #2C2826;
      color: #fff;
      padding: 10px 20px;
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Loading / error states */
    .center-msg {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: 'Inter', sans-serif;
      color: #8A7F78;
      text-align: center;
      padding: 40px;
    }
    .center-msg .big { font-size: 2.5rem; }
  </style>
</head>
<body>

  <div id="page-root" class="botanical-page" style="display:none">

    <!-- Botanical corner decorations (top-left + bottom-right) -->
    <svg class="botanical-corner botanical-corner--tl" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- Main curving stem -->
      <path d="M15,185 Q50,130 90,90 Q130,50 170,20" stroke="#4A7C59" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
      <!-- Leaves -->
      <ellipse cx="60" cy="140" rx="18" ry="10" fill="#7BAE8E" opacity="0.55" transform="rotate(-45 60 140)"/>
      <ellipse cx="90" cy="105" rx="16" ry="9"  fill="#4A7C59" opacity="0.55" transform="rotate(-50 90 105)"/>
      <ellipse cx="120" cy="72"  rx="14" ry="8"  fill="#7BAE8E" opacity="0.5"  transform="rotate(-55 120 72)"/>
      <ellipse cx="148" cy="45"  rx="12" ry="7"  fill="#4A7C59" opacity="0.45" transform="rotate(-60 148 45)"/>
      <!-- Side branch left -->
      <path d="M55,145 Q30,125 20,105" stroke="#4A7C59" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="22" cy="110" rx="12" ry="7" fill="#7BAE8E" opacity="0.5" transform="rotate(30 22 110)"/>
      <ellipse cx="35" cy="120" rx="10" ry="6" fill="#4A7C59" opacity="0.4" transform="rotate(20 35 120)"/>
      <!-- Small flowers -->
      <circle cx="90" cy="90"  r="6" fill="#B87D8F" opacity="0.8"/>
      <circle cx="86" cy="86"  r="4" fill="#EDD5DB" opacity="0.6"/>
      <circle cx="94" cy="86"  r="4" fill="#EDD5DB" opacity="0.6"/>
      <circle cx="94" cy="94"  r="4" fill="#EDD5DB" opacity="0.6"/>
      <circle cx="86" cy="94"  r="4" fill="#EDD5DB" opacity="0.6"/>
      <circle cx="170" cy="20" r="5" fill="#C97B5A" opacity="0.7"/>
      <circle cx="166" cy="16" r="3" fill="#FAEAE0" opacity="0.7"/>
      <circle cx="174" cy="16" r="3" fill="#FAEAE0" opacity="0.7"/>
      <circle cx="174" cy="24" r="3" fill="#FAEAE0" opacity="0.7"/>
      <circle cx="166" cy="24" r="3" fill="#FAEAE0" opacity="0.7"/>
      <!-- Tiny buds -->
      <circle cx="148" cy="43" r="4" fill="#B87D8F" opacity="0.65"/>
      <circle cx="22"  cy="108" r="3" fill="#B87D8F" opacity="0.6"/>
      <!-- Fern fronds -->
      <path d="M35,158 Q25,150 18,160" stroke="#7BAE8E" stroke-width="1" fill="none" opacity="0.6"/>
      <path d="M35,158 Q30,170 22,175" stroke="#7BAE8E" stroke-width="1" fill="none" opacity="0.6"/>
      <path d="M35,158 Q42,155 50,160" stroke="#7BAE8E" stroke-width="1" fill="none" opacity="0.5"/>
    </svg>

    <svg class="botanical-corner botanical-corner--br" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M15,185 Q50,130 90,90 Q130,50 170,20" stroke="#4A7C59" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
      <ellipse cx="60" cy="140" rx="18" ry="10" fill="#7BAE8E" opacity="0.55" transform="rotate(-45 60 140)"/>
      <ellipse cx="90" cy="105" rx="16" ry="9"  fill="#4A7C59" opacity="0.55" transform="rotate(-50 90 105)"/>
      <ellipse cx="120" cy="72"  rx="14" ry="8"  fill="#7BAE8E" opacity="0.5"  transform="rotate(-55 120 72)"/>
      <ellipse cx="148" cy="45"  rx="12" ry="7"  fill="#4A7C59" opacity="0.45" transform="rotate(-60 148 45)"/>
      <path d="M55,145 Q30,125 20,105" stroke="#4A7C59" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="22" cy="110" rx="12" ry="7" fill="#7BAE8E" opacity="0.5" transform="rotate(30 22 110)"/>
      <circle cx="90" cy="90"  r="6" fill="#B87D8F" opacity="0.8"/>
      <circle cx="86" cy="86"  r="4" fill="#EDD5DB" opacity="0.6"/>
      <circle cx="94" cy="86"  r="4" fill="#EDD5DB" opacity="0.6"/>
      <circle cx="94" cy="94"  r="4" fill="#EDD5DB" opacity="0.6"/>
      <circle cx="86" cy="94"  r="4" fill="#EDD5DB" opacity="0.6"/>
      <circle cx="170" cy="20" r="5" fill="#C97B5A" opacity="0.7"/>
      <circle cx="148" cy="43" r="4" fill="#B87D8F" opacity="0.65"/>
      <path d="M35,158 Q25,150 18,160" stroke="#7BAE8E" stroke-width="1" fill="none" opacity="0.6"/>
      <path d="M35,158 Q30,170 22,175" stroke="#7BAE8E" stroke-width="1" fill="none" opacity="0.6"/>
    </svg>

    <!-- Page content -->
    <div class="botanical-content">
      <div class="botanical-emoji" id="pg-emoji">🌸</div>
      <div class="botanical-occasion" id="pg-occasion">Just Because</div>
      <h1 class="botanical-title" id="pg-title">Loading...</h1>
      <div class="botanical-divider">
        <div class="botanical-divider-icon">🌿</div>
      </div>
      <p class="botanical-message" id="pg-message"></p>
      <div class="botanical-date" id="pg-date"></div>
    </div>

    <!-- Controls -->
    <button class="botanical-back" onclick="history.back()">← Back</button>
    <button class="botanical-share" id="share-btn">Share link</button>
  </div>

  <!-- Loading state -->
  <div id="loading-state" class="center-msg">
    <div class="big">🌸</div>
    <p>Opening your page...</p>
  </div>

  <!-- Error state -->
  <div id="error-state" class="center-msg" style="display:none">
    <div class="big">🍃</div>
    <h2>Page not found</h2>
    <p>This page may have been deleted.</p>
    <a href="/pages.html" style="margin-top:16px;color:#4A7C59;font-weight:600">← Back to Pages</a>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    const id = location.pathname.split('/page/')[1];

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-GB', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
    }

    async function loadPage() {
      if (!id) { showError(); return; }
      try {
        const res  = await fetch(`/api/pages/${id}`);
        if (!res.ok) { showError(); return; }
        const page = await res.json();

        document.getElementById('pg-emoji').textContent   = page.emoji || '🌸';
        document.getElementById('pg-occasion').textContent = page.occasion || '';
        document.getElementById('pg-title').textContent   = page.title || '';
        document.getElementById('pg-message').textContent = page.message || '';
        document.getElementById('pg-date').textContent    = formatDate(page.createdAt);
        document.title = page.title + ' — Flat Hub';

        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('page-root').style.display = '';
      } catch {
        showError();
      }
    }

    function showError() {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('error-state').style.display = '';
    }

    document.getElementById('share-btn').addEventListener('click', async () => {
      const url = location.href;
      if (navigator.share) {
        try {
          await navigator.share({ url, title: document.getElementById('pg-title').textContent });
        } catch { /* cancelled */ }
      } else {
        await navigator.clipboard.writeText(url);
        showToast('Link copied to clipboard');
      }
    });

    loadPage();
  </script>
</body>
</html>
