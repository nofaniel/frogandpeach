<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4A7C59">
  <title>Pages — Flat Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/botanical.css">
  <style>
    .pages-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Builder modal overrides */
    .builder-modal {
      max-height: 95dvh;
    }

    .occasion-select {
      width: 100%;
    }

    .preview-box {
      background: #FDFAF5;
      border: 1.5px dashed #D4C9C0;
      border-radius: 14px;
      padding: 24px 20px;
      text-align: center;
      margin-bottom: 6px;
    }
    .preview-box .pv-emoji  { font-size: 2.2rem; }
    .preview-box .pv-title  { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: #2D5A3D; font-weight: 700; margin-top: 6px; }
    .preview-box .pv-occ    { font-size: 0.72rem; color: #B87D8F; margin-top: 4px; letter-spacing: 0.08em; text-transform: uppercase; }
    .preview-box .pv-msg    { font-style: italic; color: #3D3028; font-size: 0.88rem; margin-top: 10px; line-height: 1.65; }
  </style>
</head>
<body>

  <header class="page-header">
    <span class="header-icon">🌸</span>
    <h1>Pages for You</h1>
  </header>

  <div class="content">
    <div class="pages-grid" id="pages-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none">
      <div class="empty-icon">🌸</div>
      <h3>No pages yet</h3>
      <p>Create a beautiful page for your partner</p>
    </div>
  </div>

  <!-- FAB -->
  <button class="fab" id="fab" title="New page" aria-label="Create page">+</button>

  <!-- Page builder modal -->
  <div class="modal-backdrop" id="builder-modal">
    <div class="modal builder-modal">
      <div class="modal-handle"></div>
      <div class="modal-title">Create a Page</div>

      <!-- Live preview -->
      <div class="preview-box">
        <div class="pv-emoji" id="pv-emoji">🌸</div>
        <div class="pv-occ"  id="pv-occ">Just Because</div>
        <div class="pv-title" id="pv-title">Your title here</div>
        <div class="pv-msg"  id="pv-msg">Your message will appear here...</div>
      </div>

      <div class="form-group">
        <label for="pg-occasion">Occasion</label>
        <select class="occasion-select" id="pg-occasion">
          <option>Just Because</option>
          <option>I Love You</option>
          <option>Good Morning</option>
          <option>Happy Anniversary</option>
          <option>Happy Birthday</option>
          <option>Thinking of You</option>
          <option>You're Amazing</option>
          <option>Sorry</option>
          <option>Good Luck</option>
          <option>Welcome Home</option>
        </select>
      </div>

      <div class="form-group">
        <label>Emoji</label>
        <div class="emoji-picker" id="emoji-picker">
          <div class="emoji-option selected" data-emoji="🌸">🌸</div>
          <div class="emoji-option" data-emoji="🌺">🌺</div>
          <div class="emoji-option" data-emoji="🌷">🌷</div>
          <div class="emoji-option" data-emoji="🌻">🌻</div>
          <div class="emoji-option" data-emoji="🌹">🌹</div>
          <div class="emoji-option" data-emoji="🍃">🍃</div>
          <div class="emoji-option" data-emoji="🌿">🌿</div>
          <div class="emoji-option" data-emoji="💕">💕</div>
          <div class="emoji-option" data-emoji="💌">💌</div>
          <div class="emoji-option" data-emoji="✨">✨</div>
          <div class="emoji-option" data-emoji="🦋">🦋</div>
          <div class="emoji-option" data-emoji="🌙">🌙</div>
        </div>
      </div>

      <div class="form-group">
        <label for="pg-title">Title</label>
        <input type="text" id="pg-title" placeholder="e.g. Happy 6 months">
      </div>

      <div class="form-group">
        <label for="pg-message">Message</label>
        <textarea id="pg-message" placeholder="Write something from the heart..."></textarea>
      </div>

      <div style="display:flex;gap:10px;margin-top:4px">
        <button class="btn btn-secondary w-full" id="cancel-builder">Cancel</button>
        <button class="btn btn-primary w-full" id="save-builder">Save Page</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a class="nav-item" href="/index.html"><span class="nav-icon">🏠</span>Home</a>
    <a class="nav-item" href="/lists.html"><span class="nav-icon">🛒</span>Lists</a>
    <a class="nav-item" href="/notes.html"><span class="nav-icon">📝</span>Notes</a>
    <a class="nav-item active" href="/pages.html"><span class="nav-icon">🌸</span>Pages</a>
    <a class="nav-item" href="/network.html"><span class="nav-icon">📡</span>Network</a>
  </nav>

  <script src="/js/pages.js"></script>
</body>
</html>
